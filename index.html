<!DOCTYPE html>
<html lang="az">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>icare.az</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">
icare.az
</div>

<div class="profile">
A
</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input type="text" placeholder="Marka və model axtar...">

</div>

<!-- FILTER -->

<div class="filters">

<select>
<option>Marka</option>
<option>BMW</option>
<option>Mercedes</option>
<option>Kia</option>
</select>

<select>
<option>Ban növü</option>
<option>Sedan</option>
<option>SUV</option>
<option>Coupe</option>
</select>

<select>
<option>Qiymət</option>
<option>0-5000</option>
<option>5000-10000</option>
<option>10000+</option>
</select>

<select>
<option>Rəng</option>
<option>Qara</option>
<option>Ağ</option>
<option>Göy</option>
</select>

<select>
<option>Şəhər</option>
<option>Bakı</option>
<option>Gəncə</option>
<option>Sumqayıt</option>
</select>

</div>

<!-- CARDS -->

<div class="container">

<div class="cards" id="list"></div>

</div>

<!-- ADD MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<h2>Yeni elan</h2>

<input id="brand" placeholder="Marka">
<input id="model" placeholder="Model">
<input id="year" placeholder="İl">
<input id="price" placeholder="Qiymət">
<input id="engine" placeholder="Mator">

<select id="body">
<option>Sedan</option>
<option>SUV</option>
<option>Coupe</option>
<option>Universal</option>
</select>

<input id="seats" placeholder="Yer sayı">
<input id="color" placeholder="Rəng">
<input id="rentacar" placeholder="Rentacar adı">
<input id="location" placeholder="Konum">
<input id="phone" placeholder="Mobil nömrə">
<input id="image" placeholder="Şəkil linki">

<button onclick="addCar()">
Elanı yerləşdir
</button>

</div>

</div>

<!-- DETAIL -->

<div class="detail" id="detail"></div>

<!-- MENU -->

<div class="bottom-menu">

<div class="menu-item active">
🏠
<div>Əsas</div>
</div>

<div class="menu-item">
❤️
<div>Seçilmişlər</div>
</div>

<div class="plus" onclick="openModal()">
+
</div>

<div class="menu-item">
💬
<div>Mesajlar</div>
</div>

<div class="menu-item">
👤
<div>Kabinet</div>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
