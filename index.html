<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>icare.az</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b1220;
color:white;
padding-bottom:100px;
}

.header{
background:#1565ff;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:28px;
font-weight:bold;
}

.profile{
width:45px;
height:45px;
background:white;
color:#1565ff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#1e293b;
color:white;
font-size:15px;
}

.filters{
display:flex;
gap:10px;
overflow:auto;
padding:10px;
}

.filters select{
padding:12px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
min-width:140px;
}

.cards{
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
background:#1e293b;
border-radius:22px;
overflow:hidden;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
font-size:28px;
font-weight:bold;
color:#4da3ff;
margin-bottom:10px;
}

.title{
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.info div{
background:#0f172a;
padding:10px;
border-radius:12px;
font-size:13px;
}

.location{
margin-top:12px;
font-size:14px;
color:#cbd5e1;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.actions button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
color:white;
font-weight:bold;
cursor:pointer;
}

.favorite{
background:#ef4444;
}

.message{
background:#22c55e;
}

.share{
background:#1565ff;
}

.bottom-menu{
position:fixed;
bottom:0;
left:0;
width:100%;
height:80px;
background:#111827;
display:flex;
justify-content:space-around;
align-items:center;
z-index:9999;
}

.menu-item{
display:flex;
flex-direction:column;
align-items:center;
font-size:12px;
color:#94a3b8;
}

.active{
color:#4da3ff;
}

.plus{
width:75px;
height:75px;
background:#1565ff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
margin-top:-35px;
cursor:pointer;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
padding:15px;
z-index:99999;
}

.modal-content{
background:#1e293b;
padding:20px;
border-radius:25px;
width:100%;
max-width:550px;
max-height:90vh;
overflow:auto;
}

.modal-content h2{
margin-bottom:15px;
}

.modal-content input,
.modal-content select{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:14px;
background:#0f172a;
color:white;
}

.modal-content button{
width:100%;
padding:15px;
background:#1565ff;
border:none;
border-radius:14px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">
icare.az
</div>

<div class="profile">
A
</div>

</div>

<div class="search">

<input type="text" placeholder="Marka və model axtar...">

</div>

<div class="filters">

<select>
<option>Marka</option>
<option>BMW</option>
<option>Mercedes</option>
<option>Kia</option>
</select>

<select>
<option>Ban növü</option>
<option>Sedan</option>
<option>SUV</option>
<option>Coupe</option>
</select>

<select>
<option>Qiymət</option>
<option>0-10000</option>
<option>10000-30000</option>
<option>30000+</option>
</select>

<select>
<option>Şəhər</option>
<option>Bakı</option>
<option>Gəncə</option>
<option>Sumqayıt</option>
</select>

</div>

<div class="cards" id="list"></div>

<div class="modal" id="modal">

<div class="modal-content">

<h2>Yeni elan</h2>

<input id="brand" placeholder="Marka">
<input id="model" placeholder="Model">
<input id="year" placeholder="İl">
<input id="price" placeholder="Qiymət">
<input id="engine" placeholder="Mator">
<input id="body" placeholder="Ban növü">
<input id="seats" placeholder="Yer sayı">
<input id="color" placeholder="Rəng">
<input id="rentacar" placeholder="Rentacar adı">
<input id="location" placeholder="Konum">
<input id="phone" placeholder="Mobil nömrə">
<input id="image" placeholder="Şəkil linki">

<button onclick="addCar()">
Elanı yerləşdir
</button>

</div>

</div>

<div class="bottom-menu">

<div class="menu-item active">
🏠
<div>Əsas</div>
</div>

<div class="menu-item">
❤️
<div>Seçilmişlər</div>
</div>

<div class="plus" onclick="openModal()">
+
</div>

<div class="menu-item">
💬
<div>Mesajlar</div>
</div>

<div class="menu-item">
👤
<div>Kabinet</div>
</div>

</div>

<script>

const SUPABASE_URL = "BURAYA_URL";
const SUPABASE_KEY = "BURAYA_KEY";

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function openModal(){
document.getElementById("modal").style.display="flex";
}

window.onclick=function(e){
if(e.target.id=="modal"){
document.getElementById("modal").style.display="none";
}
}

async function addCar(){

const brand=document.getElementById("brand").value;
const model=document.getElementById("model").value;
const year=document.getElementById("year").value;
const price=document.getElementById("price").value;
const engine=document.getElementById("engine").value;
const body=document.getElementById("body").value;
const seats=document.getElementById("seats").value;
const color=document.getElementById("color").value;
const rentacar=document.getElementById("rentacar").value;
const location=document.getElementById("location").value;
const phone=document.getElementById("phone").value;
const image=document.getElementById("image").value;

await supabase.from("cars").insert([
{
brand,
model,
year,
price,
engine,
body,
seats,
color,
rentacar,
location,
phone,
image
}
]);

loadCars();

document.getElementById("modal").style.display="none";

}

async function loadCars(){

const { data } = await supabase
.from("cars")
.select("*")
.order("id",{ascending:false});

const list=document.getElementById("list");

list.innerHTML="";

data.forEach(car=>{

list.innerHTML += `

<div class="card">

<img src="${car.image}">

<div class="card-content">

<div class="price">
${car.price} AZN
</div>

<div class="title">
${car.brand} ${car.model}
</div>

<div class="info">

<div>📅 ${car.year}</div>
<div>⚙️ ${car.engine}</div>
<div>🚘 ${car.body}</div>
<div>💺 ${car.seats}</div>
<div>🎨 ${car.color}</div>
<div>🏢 ${car.rentacar}</div>

</div>

<div class="location">
📍 ${car.location}
</div>

<div class="location">
📞 ${car.phone}
</div>

<div class="actions">

<button class="favorite">
❤️
</button>

<button class="share"
onclick="navigator.share({url:window.location.href})">
🔗
</button>

<button class="message"
onclick="window.open('https://wa.me/${car.phone}')">
💬
</button>

</div>

</div>

</div>

`;

});

}

loadCars();

</script>

</body>
</html>
