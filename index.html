<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icare.az</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b1120;
color:white;
padding-bottom:95px;
}

/* HEADER */

.header{
position:sticky;
top:0;
z-index:1000;
background:#1565ff;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.logo{
font-size:24px;
font-weight:bold;
}

.profile{
width:42px;
height:42px;
border-radius:50%;
background:white;
color:#1565ff;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
}

/* SEARCH */

.search{
padding:15px;
background:#111827;
}

.search input{
width:100%;
padding:14px;
border:none;
border-radius:15px;
background:#1e293b;
color:white;
font-size:15px;
}

/* FILTER */

.filters{
display:flex;
overflow:auto;
gap:10px;
padding:12px;
background:#111827;
}

.filters select{
min-width:140px;
padding:12px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
}

/* CARDS */

.container{
padding:15px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:18px;
}

.card{
background:#1e293b;
border-radius:24px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,0.35);
transition:0.3s;
}

.card:hover{
transform:translateY(-4px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:14px;
}

.vip{
background:gold;
color:black;
display:inline-block;
padding:5px 10px;
border-radius:10px;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
}

.price{
font-size:28px;
font-weight:bold;
color:#4da3ff;
margin-bottom:12px;
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:10px;
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:12px;
}

.info{
background:#0f172a;
padding:9px;
border-radius:12px;
font-size:13px;
color:#cbd5e1;
}

.location{
margin-top:8px;
font-size:13px;
color:#94a3b8;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.actions button{
flex:1;
padding:12px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:bold;
}

.favorite{
background:#ef4444;
color:white;
}

.message{
background:#22c55e;
color:white;
}

.share{
background:#1565ff;
color:white;
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
padding:15px;
z-index:2000;
}

.modal-content{
background:#1e293b;
width:100%;
max-width:550px;
border-radius:25px;
padding:20px;
max-height:90vh;
overflow:auto;
}

.modal-content h2{
margin-bottom:15px;
}

.modal-content input,
.modal-content select{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:14px;
background:#0f172a;
color:white;
}

.modal-content button{
width:100%;
padding:15px;
background:#1565ff;
border:none;
border-radius:15px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

/* MENU */

.bottom-menu{
position:fixed;
bottom:0;
left:0;
width:100%;
height:82px;
background:#111827;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid #1e293b;
z-index:3000;
}

.menu-item{
display:flex;
flex-direction:column;
align-items:center;
font-size:11px;
color:#94a3b8;
}

.menu-item.active{
color:#4da3ff;
}

.plus{
width:70px;
height:70px;
background:#1565ff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
margin-top:-40px;
box-shadow:0 10px 30px rgba(21,101,255,0.5);
}

/* DETAIL */

.detail{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0b1120;
z-index:5000;
overflow:auto;
display:none;
}

.detail img{
width:100%;
height:320px;
object-fit:cover;
}

.detail-content{
padding:20px;
}

.detail-price{
font-size:34px;
font-weight:bold;
color:#4da3ff;
margin-bottom:12px;
}

.detail-title{
font-size:28px;
font-weight:bold;
margin-bottom:14px;
}

.detail-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.detail-info{
background:#1e293b;
padding:12px;
border-radius:14px;
}

</style>
</head>
<body>

<!-- HEADER -->

<div class="header">

<div class="logo">
icare.az
</div>

<div class="profile">
A
</div>

</div>

<!-- SEARCH -->

<div class="search">
<input type="text" placeholder="Marka və model axtar...">
</div>

<!-- FILTER -->

<div class="filters">

<select>
<option>Marka</option>
<option>BMW</option>
<option>Mercedes</option>
<option>Kia</option>
</select>

<select>
<option>Ban növü</option>
<option>Sedan</option>
<option>SUV</option>
<option>Coupe</option>
</select>

<select>
<option>Qiymət</option>
<option>0-5000</option>
<option>5000-10000</option>
<option>10000+</option>
</select>

<select>
<option>Rəng</option>
<option>Qara</option>
<option>Ağ</option>
<option>Göy</option>
</select>

<select>
<option>Şəhər</option>
<option>Bakı</option>
<option>Gəncə</option>
<option>Sumqayıt</option>
</select>

</div>

<!-- CARDS -->

<div class="container">

<div class="cards" id="list"></div>

</div>

<!-- ADD MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<h2>Yeni elan</h2>

<input id="brand" placeholder="Marka">
<input id="model" placeholder="Model">
<input id="year" placeholder="İl">
<input id="price" placeholder="Qiymət">
<input id="engine" placeholder="Mator">
<input id="mileage" placeholder="Yürüş km">
<input id="vin" placeholder="VIN">

<select id="body">
<option>Sedan</option>
<option>SUV</option>
<option>Coupe</option>
<option>Universal</option>
</select>

<select id="fuel">
<option>Benzin</option>
<option>Dizel</option>
<option>Elektrik</option>
<option>Hibrid</option>
</select>

<select id="gearbox">
<option>Avtomat</option>
<option>Mexanika</option>
</select>

<input id="seats" placeholder="Yer sayı">
<input id="color" placeholder="Rəng">
<input id="rentacar" placeholder="Rentacar adı">
<input id="location" placeholder="Konum">
<input id="phone" placeholder="Mobil nömrə">
<input id="image" placeholder="Şəkil linki">

<button onclick="addCar()">
Elanı yerləşdir
</button>

</div>

</div>

<!-- DETAIL -->

<div class="detail" id="detail"></div>

<!-- MENU -->

<div class="bottom-menu">

<div class="menu-item active">
🏠
<div>Əsas</div>
</div>

<div class="menu-item">
❤️
<div>Seçilmiş</div>
</div>

<div class="plus" onclick="openModal()">
+
</div>

<div class="menu-item">
💬
<div>Mesajlar</div>
</div>

<div class="menu-item">
👤
<div>Kabinet</div>
</div>

</div>

<script>

const SUPABASE_URL="BURAYA_URL";
const SUPABASE_KEY="BURAYA_KEY";

const supabase=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* OPEN MODAL */

function openModal(){
document.getElementById("modal").style.display="flex";
}

window.onclick=function(e){
if(e.target.id=="modal"){
document.getElementById("modal").style.display="none";
}
}

/* ADD */

async function addCar(){

const brand=document.getElementById("brand").value;
const model=document.getElementById("model").value;
const year=document.getElementById("year").value;
const price=document.getElementById("price").value;
const engine=document.getElementById("engine").value;
const mileage=document.getElementById("mileage").value;
const vin=document.getElementById("vin").value;
const body=document.getElementById("body").value;
const fuel=document.getElementById("fuel").value;
const gearbox=document.getElementById("gearbox").value;
const seats=document.getElementById("seats").value;
const color=document.getElementById("color").value;
const rentacar=document.getElementById("rentacar").value;
const location=document.getElementById("location").value;
const phone=document.getElementById("phone").value;
const image=document.getElementById("image").value;

await supabase.from("cars").insert([
{
brand,
model,
year,
price,
engine,
mileage,
vin,
body,
fuel,
gearbox,
seats,
color,
rentacar,
location,
phone,
image
}
]);

loadCars();

document.getElementById("modal").style.display="none";

}

/* LOAD */

async function loadCars(){

const { data } = await supabase
.from("cars")
.select("*")
.order("id",{ascending:false});

const list=document.getElementById("list");

list.innerHTML="";

data.forEach(car=>{

list.innerHTML += `

<div class="card">

<img src="${car.image}"
onclick="openDetail('${car.id}')">

<div class="card-content">

<div class="vip">
VIP
</div>

<div class="price">
${car.price} AZN
</div>

<div class="title">
${car.brand} ${car.model}
</div>

<div class="info-grid">

<div class="info">
📅 ${car.year}
</div>

<div class="info">
⚙ ${car.engine}
</div>

<div class="info">
⛽ ${car.fuel}
</div>

<div class="info">
🚘 ${car.body}
</div>

<div class="info">
💺 ${car.seats}
</div>

<div class="info">
🎨 ${car.color}
</div>

<div class="info">
🔄 ${car.gearbox}
</div>

<div class="info">
🛣 ${car.mileage}
</div>

</div>

<div class="location">
📍 ${car.location}
</div>

<div class="location">
🏢 ${car.rentacar}
</div>

<div class="actions">

<button class="favorite">
❤️
</button>

<button class="share"
onclick="navigator.share({title:'icare.az',url:window.location.href})">
🔗
</button>

<button class="message"
onclick="window.open('https://wa.me/${car.phone}')">
💬
</button>

</div>

</div>

</div>

`;

});

}

/* DETAIL */

async function openDetail(id){

const { data } = await supabase
.from("cars")
.select("*")
.eq("id",id)
.single();

const detail=document.getElementById("detail");

detail.style.display="block";

detail.innerHTML=`

<img src="${data.image}">

<div class="detail-content">

<div class="detail-price">
${data.price} AZN
</div>

<div class="detail-title">
${data.brand} ${data.model}
</div>

<div class="detail-grid">

<div class="detail-info">
📅 ${data.year}
</div>

<div class="detail-info">
⚙ ${data.engine}
</div>

<div class="detail-info">
⛽ ${data.fuel}
</div>

<div class="detail-info">
🚘 ${data.body}
</div>

<div class="detail-info">
💺 ${data.seats}
</div>

<div class="detail-info">
🎨 ${data.color}
</div>

<div class="detail-info">
🔄 ${data.gearbox}
</div>

<div class="detail-info">
🛣 ${data.mileage}
</div>

<div class="detail-info">
🔑 ${data.vin}
</div>

</div>

<div style="margin-top:20px;">
📍 ${data.location}
</div>

<div style="margin-top:10px;">
🏢 ${data.rentacar}
</div>

<div style="margin-top:10px;">
📞 ${data.phone}
</div>

<div class="actions" style="margin-top:20px;">

<button class="favorite">
❤️ Sevimli
</button>

<button class="share">
🔗 Paylaş
</button>

<button class="message"
onclick="window.open('https://wa.me/${data.phone}')">
💬 Mesaj
</button>

</div>

<button
style="
width:100%;
padding:16px;
margin-top:20px;
background:#1565ff;
border:none;
border-radius:16px;
color:white;
font-size:16px;"
onclick="closeDetail()">
Bağla
</button>

</div>

`;

}

function closeDetail(){
document.getElementById("detail").style.display="none";
}

loadCars();

</script>

</body>
</html>
