<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icare.az</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f1724;
color:white;
padding-bottom:90px;
}

.header{
background:#1565ff;
padding:15px;
font-size:24px;
font-weight:bold;
position:sticky;
top:0;
z-index:100;
}

.filter{
padding:10px;
display:flex;
gap:10px;
overflow:auto;
background:#111827;
}

.filter input,
.filter select{
background:#1e293b;
border:none;
color:white;
padding:10px;
border-radius:10px;
min-width:140px;
}

.container{
padding:12px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
}

.card{
background:#1e293b;
border-radius:18px;
overflow:hidden;
position:relative;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:12px;
}

.price{
font-size:24px;
font-weight:bold;
color:#4da3ff;
margin-bottom:10px;
}

.title{
font-size:18px;
margin-bottom:8px;
}

.info{
color:#cbd5e1;
margin-bottom:5px;
font-size:14px;
}

.buttons{
display:flex;
gap:8px;
margin-top:10px;
}

.buttons button{
flex:1;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.whatsapp{
background:#22c55e;
color:white;
}

.favorite{
background:#ef4444;
color:white;
}

.share{
background:#1565ff;
color:white;
}

.add-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
padding:15px;
z-index:200;
}

.form{
background:#1e293b;
padding:20px;
border-radius:20px;
width:100%;
max-width:500px;
max-height:90vh;
overflow:auto;
}

.form h2{
margin-bottom:15px;
}

.form input,
.form select{
width:100%;
padding:12px;
margin-bottom:10px;
background:#0f1724;
border:none;
border-radius:10px;
color:white;
}

.form button{
width:100%;
padding:14px;
background:#1565ff;
border:none;
border-radius:12px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.bottom-menu{
position:fixed;
bottom:0;
left:0;
width:100%;
height:75px;
background:#111827;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid #1e293b;
z-index:300;
}

.menu-item{
display:flex;
flex-direction:column;
align-items:center;
font-size:12px;
color:#9ca3af;
}

.menu-item.active{
color:#4da3ff;
}

.plus{
width:60px;
height:60px;
background:#1565ff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
margin-top:-35px;
color:white;
}

</style>
</head>
<body>

<div class="header">
icare.az
</div>

<div class="filter">
<input type="text" placeholder="Marka">
<select>
<option>Ban növü</option>
<option>Sedan</option>
<option>SUV</option>
<option>Hatchback</option>
</select>

<select>
<option>Qiymət</option>
<option>0-5000</option>
<option>5000-10000</option>
<option>10000+</option>
</select>

<input type="text" placeholder="Şəhər">
</div>

<div class="container">

<div class="cards" id="list"></div>

</div>

<div class="add-modal" id="modal">

<div class="form">

<h2>Yeni Elan</h2>

<input id="brand" placeholder="Marka">
<input id="model" placeholder="Model">
<input id="year" placeholder="İl">
<input id="price" placeholder="Qiymət">
<input id="engine" placeholder="Mator">
<input id="seats" placeholder="Yer sayı">

<select id="body">
<option>Sedan</option>
<option>SUV</option>
<option>Hatchback</option>
</select>

<input id="color" placeholder="Rəng">
<input id="rentacar" placeholder="Rentacar adı">
<input id="location" placeholder="Konum">
<input id="phone" placeholder="Mobil nömrə">
<input id="image" placeholder="Şəkil linki">

<button onclick="addCar()">Elanı yerləşdir</button>

</div>

</div>

<div class="bottom-menu">

<div class="menu-item active">
🏠
<div>ƏSAS</div>
</div>

<div class="menu-item">
❤️
<div>SEÇİLMİŞLƏR</div>
</div>

<div class="plus" onclick="openModal()">
+
</div>

<div class="menu-item">
💬
<div>MESAJLAR</div>
</div>

<div class="menu-item">
👤
<div>KABİNET</div>
</div>

</div>

<script>

const SUPABASE_URL = "BURAYA_URL";
const SUPABASE_KEY = "BURAYA_KEY";

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function openModal(){
document.getElementById("modal").style.display="flex";
}

window.onclick=function(e){
if(e.target.id=="modal"){
document.getElementById("modal").style.display="none";
}
}

async function addCar(){

const brand=document.getElementById("brand").value;
const model=document.getElementById("model").value;
const year=document.getElementById("year").value;
const price=document.getElementById("price").value;
const engine=document.getElementById("engine").value;
const seats=document.getElementById("seats").value;
const body=document.getElementById("body").value;
const color=document.getElementById("color").value;
const rentacar=document.getElementById("rentacar").value;
const location=document.getElementById("location").value;
const phone=document.getElementById("phone").value;
const image=document.getElementById("image").value;

await supabase.from("cars").insert([
{
brand,
model,
year,
price,
engine,
seats,
body,
color,
rentacar,
location,
phone,
image
}
]);

loadCars();

document.getElementById("modal").style.display="none";

}

async function loadCars(){

const { data } = await supabase
.from("cars")
.select("*")
.order("id",{ascending:false});

const list=document.getElementById("list");

list.innerHTML="";

data.forEach(car=>{

list.innerHTML+=`

<div class="card">

<img src="${car.image}">

<div class="card-content">

<div class="price">
${car.price} AZN
</div>

<div class="title">
${car.brand} ${car.model}
</div>

<div class="info">
📅 ${car.year}
</div>

<div class="info">
⚙ ${car.engine}
</div>

<div class="info">
🚘 ${car.body}
</div>

<div class="info">
💺 ${car.seats}
</div>

<div class="info">
🎨 ${car.color}
</div>

<div class="info">
📍 ${car.location}
</div>

<div class="info">
🏢 ${car.rentacar}
</div>

<div class="buttons">

<button class="favorite">
❤️
</button>

<button class="share"
onclick="navigator.share({title:'icare.az',url:window.location.href})">
🔗
</button>

<button class="whatsapp"
onclick="window.open('https://wa.me/${car.phone}')">
💬
</button>

</div>

</div>

</div>

`;

});

}

loadCars();

</script>

</body>
</html>
