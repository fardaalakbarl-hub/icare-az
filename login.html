<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>icare.az Login</title>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
url("https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1200");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
backdrop-filter:blur(5px);
}

.box{
background:#1e293b;
padding:30px;
border-radius:20px;
width:320px;
}

h1{
text-align:center;
color:white;
margin-bottom:20px;
}

.tabs{
display:flex;
margin-top:15px;
margin-bottom:30px;
gap:10px;
}

.tabs button{
flex:1;
}

input{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
box-sizing:border-box;
}

button{
padding:14px;
border:none;
border-radius:10px;
background:#1565ff;
color:white;
font-size:15px;
cursor:pointer;
width:100%;
}

.form{
display:none;
}

.active{
display:block;
}

</style>

</head>

<body>

<div class="box">

<h1>icare.az</h1>

<button onclick="showLogin()">
Daxil ol
</button>

<button
style="margin-top:10px;"
onclick="showRegister()">
Qeydiyyat
</button>

<!-- LOGIN -->

<div id="loginForm" class="form active">

<input type="text"
id="loginUsername"
placeholder="İstifadəçi adı">

<input type="password"
id="loginPassword"
placeholder="Kod">

<button onclick="login()">
Daxil ol
</button>
<button
style="margin-top:10px;background:#1e293b;color:#4da3ff;"
onclick="showRegister()">
Qeydiyyat
</button>

</div>

<!-- REGISTER -->

<div id="registerForm" class="form">

<input type="text"
id="registerUsername"
placeholder="Yeni istifadəçi adı">

<input type="password"
id="registerPassword"
placeholder="Yeni kod">

<button onclick="register()">
Qeydiyyatdan keç
</button>

</div>

</div>

<script>

/* FORM SWITCH */

function showLogin(){

document.getElementById("loginForm")
.classList.add("active");

document.getElementById("registerForm")
.classList.remove("active");

}

function showRegister(){

document.getElementById("registerForm")
.classList.add("active");

document.getElementById("loginForm")
.classList.remove("active");

}

/* REGISTER */

function register(){

const username =
document.getElementById("registerUsername").value;

const password =
document.getElementById("registerPassword").value;

if(!username || !password){

alert("Məlumatları doldur");
return;

}

if(localStorage.getItem("user_"+username)){

alert("Bu istifadəçi artıq var");
return;

}

localStorage.setItem(
"user_"+username,
password
);

alert("Qeydiyyat tamamlandı");

showLogin();

}

/* LOGIN */

function login(){

const username =
document.getElementById("loginUsername").value;

const password =
document.getElementById("loginPassword").value;

const savedPassword =
localStorage.getItem("user_"+username);

if(password === savedPassword){

localStorage.setItem(
"activeUser",
username
);

window.location.href =
"index.html";

}else{

alert("İstifadəçi adı və ya kod səhvdir");

}

}

</script>

</body>
</html>
