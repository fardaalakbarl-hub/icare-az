<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>icare.az Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0b1220;
overflow:hidden;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(21,101,255,0.2),rgba(21,101,255,0.2)),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070");
background-size:cover;
background-position:center;
filter:blur(3px);
transform:scale(1.1);
}

.box{
position:relative;
z-index:10;
width:95%;
max-width:420px;
background:rgba(15,23,42,0.95);
padding:35px;
border-radius:28px;
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.logo{
font-size:38px;
font-weight:bold;
color:#4da3ff;
text-align:center;
margin-bottom:8px;
}

.sub{
text-align:center;
color:#94a3b8;
margin-bottom:28px;
}

input{
width:100%;
padding:16px;
margin-bottom:14px;
border:none;
border-radius:16px;
background:#1e293b;
color:white;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#1565ff;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.secondary{
background:#1e293b;
color:#4da3ff;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="box">

<div class="logo">
icare.az
</div>

<div class="sub">
Hesabınıza daxil olun
</div>

<input type="text" id="username" placeholder="İstifadəçi adı">

<input type="password" id="password" placeholder="Kod">

<button onclick="login()">
Daxil ol
</button>

<button class="secondary" onclick="register()">
Qeydiyyat
</button>

</div>

<script>

const SUPABASE_URL = "https://irwhnuywppwsfcluaelt.supabase.co/rest/";
const SUPABASE_KEY = "sb_publishable_3-DgPo74tGElnm0G6qko5Q_8vBpS46M";

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* REGISTER */

async function register(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(!username || !password){
alert("Məlumatları doldur");
return;
}

const { error } = await supabase
.from("users")
.insert([
{
username,
password
}
]);

if(error){
alert("Bu istifadəçi artıq var");
}else{
alert("Qeydiyyat tamamlandı");
}

}

/* LOGIN */

async function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const { data } = await supabase
.from("users")
.select("*")
.eq("username", username)
.eq("password", password);

if(data.length > 0){

localStorage.setItem(
"activeUser",
username
);

window.location.href = "index.html";

}else{

alert("Kod və ya istifadəçi adı yanlışdır");

}

}

</script>

</body>
</html>
