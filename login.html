<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>icare.az</title>

<style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;

background:
linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
url("https://images.stockcake.com/public/c/6/4/c643bddc-a77b-4c43-8b5f-58a3dc6a8191_large/busy-car-lot-stockcake.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}
.box{
background:rgba(30,41,59,0.9);
backdrop-filter:blur(12px);
padding:30px;
border-radius:25px;
width:100%;
max-width:380px;
position:relative;
overflow:hidden;

box-shadow:
0 0 10px rgba(255,255,255,0.2),
0 0 20px rgba(255,255,255,0.15),
0 0 40px rgba(21,101,255,0.25);
}

h1{
text-align:center;
color:white;
margin-bottom:30px;
font-size:50px;

text-shadow:
0 0 5px rgba(255,255,255,0.8),
0 0 10px rgba(255,255,255,0.7),
0 0 20px rgba(21,101,255,0.9),
0 0 40px rgba(21,101,255,0.8);
}
input{
width:100%;
padding:15px;
margin-bottom:14px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
font-size:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#1565ff;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.register-btn{
background:#1e293b;
color:#4da3ff;
}
.particles{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
overflow:hidden;
z-index:1;
  pointer-events:none;
}

.particles::before,
.particles::after{
content:"";
position:absolute;
width:200%;
height:200%;

background-image:
radial-gradient(white 1px, transparent 1px);

background-size:40px 40px;

animation:moveParticles 20s linear infinite;

opacity:0.15;
}

.particles::after{
animation-duration:35s;
opacity:0.08;
}

@keyframes moveParticles{

from{
transform:translateY(0);
}

to{
transform:translateY(-200px);
}

}
</style>

</head>

<body>
<div class="particles"></div>
<div class="box">

<h1>icare.az</h1>

<input
type="text"
id="username"
placeholder="İstifadəçi adı">

<div style="position:relative;">

<input
type="password"
id="password"
placeholder="Kod"
style="padding-right:50px;">

<span
onclick="togglePassword()"
style="
position:absolute;
right:15px;
top:15px;
cursor:pointer;
color:white;
font-size:18px;">
👁
</span>

</div>
<button onclick="login()">
Daxil ol
</button>

<button
class="register-btn"
onclick="register()">
Qeydiyyat
</button>

</div>

<script>

function register(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(!username || !password){

alert("Məlumatları doldur");
return;

}

if(localStorage.getItem("user_"+username)){

alert("Bu istifadəçi artıq var");
return;

}

localStorage.setItem(
"user_"+username,
password
);

alert("Qeydiyyat tamamlandı");

}

function login(){
  

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const savedPassword =
localStorage.getItem("user_"+username);

if(password === savedPassword){

localStorage.setItem(
"activeUser",
username
);

window.location.href =
"index.html";

}else{

alert("İstifadəçi adı və ya kod səhvdir");

}

}
function togglePassword(){

const password =
document.getElementById("password");

if(password.type === "password"){

password.type = "text";

}else{

password.type = "password";

}

}
</script>

</body>
</html>
