<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:30px;
border-radius:20px;
width:320px;
}

h1{
color:white;
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#1565ff;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1>icare.az</h1>

<input type="text" id="username" placeholder="İstifadəçi adı">

<input type="password" id="password" placeholder="Kod">

<button onclick="login()">
Daxil ol
</button>

</div>

<script>

function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(
username === "ferda"
&&
password === "123"
){

localStorage.setItem(
"activeUser",
username
);

window.location.href = "index.html";

}else{

alert("İstifadəçi adı və ya kod səhvdir");

}

}

</script>

</body>
</html>
