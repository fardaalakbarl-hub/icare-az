<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>icare.az Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
width:350px;
background:#1e293b;
padding:30px;
border-radius:20px;
}

h1{
color:#4da3ff;
text-align:center;
}

input{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#1565ff;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1>icare.az</h1>

<input type="text" id="username" placeholder="İstifadəçi adı">

<input type="password" id="password" placeholder="Kod">

<button onclick="register()">
Qeydiyyat
</button>

<button onclick="login()">
Daxil ol
</button>

</div>

<script>

const supabase = window.supabase.createClient(
"https://irwhnuywppwsfcluaelt.supabase.co",
"sb_publishable_3-DgPo74tGElnm0G6qko5Q_8vBpS46M"
);

async function register(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const { error } = await supabase
.from("users")
.insert([
{
username:username,
password:password
}
]);

if(error){

alert("İstifadəçi artıq var");

}else{

alert("Qeydiyyat tamamlandı");

}

}

async function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const { data } = await supabase
.from("users")
.select("*")
.eq("username",username)
.eq("password",password);

if(data.length > 0){

localStorage.setItem(
"activeUser",
username
);

window.location.href="index.html";

}else{

alert("Kod və ya istifadəçi adı səhvdir");

}

}

</script>

</body>
</html>
